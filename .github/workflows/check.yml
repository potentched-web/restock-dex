name: Pokemon stock check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: stock-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py https://titancards.co.uk https://www.bbstcg.co.uk https://iconic-tcg.com https://evolvault.com https://www.hobby-addicts.com https://hoodlumsuk.com https://buyanycards.co.uk https://www.thetcgshop.co.uk https://www.hillscards.co.uk https://www.120hp.co.uk https://jetcards.uk https://www.nxtgentrading.co.uk https://paragnnetwork.co.uk https://www.trolltradercards.com
      - run: python3 check.py
        if: false
      - name: Save what was seen
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json status.json history.json
          git diff --cached --quiet || (git commit -m "Update stock state" && git push)
