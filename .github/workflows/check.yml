name: Pokemon stock check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: stock-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - name: Save what was seen
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json status.json history.json
          git diff --cached --quiet || (git commit -m "Update stock state" && git push)
