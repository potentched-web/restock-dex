name: Pokemon stock check
on:
  schedule:
    - cron: "*/5 * * * *"   # check.py only does a full scan every 15 min, except on release days
  workflow_dispatch:
permissions:
  contents: write
concurrency: stock-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save what was seen
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json status.json history.json
          git diff --cached --quiet || (git commit -m "Update stock state" && git push)
